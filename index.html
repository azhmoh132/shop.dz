<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop DZ - متجرك الإلكتروني</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: white;
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #2563eb;
    }

    .hero {
      text-align: center;
      padding: 80px 20px;
      background: white;
    }

    .hero h1 {
      font-size: 38px;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 18px;
      color: #6b7280;
      margin-bottom: 30px;
    }

    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 15px 35px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .section {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .card h2 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    #storeForm {
      display: none;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🛍️ Shop DZ</div>
  <div>متجرك الإلكتروني في الجزائر</div>
</header>

<section class="hero">
  <h1>أنشئ متجرك الإلكتروني في الجزائر</h1>

  <p>
    أنشئ متجرك، أضف منتجاتك وابدأ البيع بالدينار الجزائري.
  </p>

  <button id="startButton" class="btn">
    ابدأ الآن
  </button>
</section>

<section class="section">

  <div id="storeForm" class="card">

    <h2>إنشاء متجرك</h2>

    <label>اسم المتجر</label>
    <input
      type="text"
      id="storeName"
      placeholder="مثال: Shop DZ"
    >

    <label>رقم الهاتف</label>
    <input
      type="tel"
      id="phone"
      placeholder="05XXXXXXXX"
    >

    <label>الولاية</label>
    <input
      type="text"
      id="wilaya"
      placeholder="مثال: الجزائر"
    >

    <button id="createButton" class="btn">
      إنشاء المتجر
    </button>

  </div>

</section>

<footer>
  © 2026 Shop DZ - جميع الحقوق محفوظة
</footer>

<script>
  const startButton = document.getElementById("startButton");
  const storeForm = document.getElementById("storeForm");

  startButton.addEventListener("click", function () {
    storeForm.style.display = "block";

    storeForm.scrollIntoView({
      behavior: "smooth"
    });
  });

  const createButton = document.getElementById("createButton");

  createButton.addEventListener("click", function () {

    const storeName = document.getElementById("storeName").value;
    const phone = document.getElementById("phone").value;
    const wilaya = document.getElementById("wilaya").value;

    if (!storeName  !phone  !wilaya) {
      alert("يرجى ملء جميع المعلومات.");
      return;
    }

    alert(
      "تم إنشاء طلب متجرك بنجاح!\n\n" +
      "اسم المتجر: " + storeName +
      "\nالهاتف: " + phone +
      "\nالولاية: " + wilaya
    );
  });
</script>

</body>
</html>
